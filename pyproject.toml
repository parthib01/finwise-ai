[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finwise-ai"
version = "0.1.0"
description = "Enterprise-grade financial intelligence chatbot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Parthib Banerjee", email = "parthibbanerjee01@gmail.com" }
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.9"
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.packages.find]
where = ["src"]

