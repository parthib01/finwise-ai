[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finwise-ai"
version = "0.1.0"
description = "Enterprise-grade financial intelligence chatbot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Parthib Banerjee", email = "parthibbanerjee01@gmail.com" }
]

dependencies = [
    # 🔹 Core API
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",

    # 🔹 Database
    "asyncpg>=0.31.0",

    # 🔹 Auth & Security
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",  # pinned due to compatibility issue

    # 🔹 Validation & Config
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "email-validator>=2.3.0",

    # 🔹 LLM Stack (LangChain + Ollama)
    "langchain>=1.2.0",
    "langchain-core>=1.2.0",
    "langchain-community>=0.4.0",
    "langchain-ollama>=1.0.0",
    "ollama>=0.6.0",

    # 🔹 Utilities
    "python-dotenv>=1.2.0",
    "orjson>=3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.9",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.packages.find]
where = ["src"]